<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的活動通行證</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 QR Code 產生器套件 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col items-center justify-center p-4">

  <!-- 票券主卡片 -->
  <div class="max-w-sm w-full bg-white rounded-3xl shadow-2xl overflow-hidden text-gray-800 relative">
    
    <!-- 票券頂部 Header -->
    <div class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white p-6 text-center relative">
      <div class="inline-block px-3 py-1 bg-white/20 backdrop-blur-md rounded-full text-xs font-semibold tracking-wider uppercase mb-2">
        Official Pass
      </div>
      <h1 class="text-2xl font-black tracking-wide">2026 青年營隊</h1>
      <p class="text-indigo-100 text-xs mt-1">現場活動報到專屬憑證</p>
    </div>

    <!-- 票券內容區 -->
    <div class="p-6 flex flex-col items-center">
      
      <!-- 報到狀態標籤 -->
      <div id="status-badge" class="mb-4 px-4 py-1.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800 animate-pulse">
        ● 尚未報到
      </div>

      <!-- QR Code 容器 -->
      <div class="p-3 bg-white border-2 border-dashed border-gray-300 rounded-2xl shadow-inner mb-4 flex items-center justify-center min-w-[200px] min-h-[200px]">
        <div id="qrcode"></div>
      </div>
      
      <p class="text-xs text-gray-400 font-mono tracking-widest uppercase mb-4" id="display-ticket-id">
        TICKET ID: LOADING...
      </p>

      <!-- 虛線裁切線效果 -->
      <div class="w-full relative flex items-center justify-center my-2">
        <div class="border-t-2 border-dashed border-gray-200 w-full"></div>
        <div class="absolute -left-10 w-6 h-6 bg-slate-900 rounded-full"></div>
        <div class="absolute -right-10 w-6 h-6 bg-slate-900 rounded-full"></div>
      </div>

      <!-- 學員資訊欄 -->
      <div class="w-full mt-4 space-y-3 bg-gray-50 p-4 rounded-xl">
        <div class="flex justify-between items-center text-sm">
          <span class="text-gray-400 font-medium">學員姓名</span>
          <span class="font-bold text-gray-800 text-base" id="student-name">載入中...</span>
        </div>
        <div class="flex justify-between items-center text-sm">
          <span class="text-gray-400 font-medium">所屬組別</span>
          <span class="font-bold text-indigo-600 bg-indigo-50 px-2.5 py-0.5 rounded-md" id="student-team">--</span>
        </div>
        <div class="flex justify-between items-center text-sm">
          <span class="text-gray-400 font-medium">報到時間</span>
          <span class="font-medium text-gray-600 text-xs" id="checkin-time">--</span>
        </div>
      </div>

      <!-- 重新整理按鈕 -->
      <button onclick="fetchTicketData()" class="mt-5 w-full py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-600 text-xs font-bold rounded-xl transition flex items-center justify-center space-x-1">
        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        重新整理狀態
      </button>

    </div>
  </div>

  <script>
    // ===== 設定區 =====
    const GAS_API_URL = "貼上你的_GAS網頁應用程式網址";

    // 取得 URL 中的 ticket_id 參數 (例如 ?id=CAMP001)，若無則預設為測試碼
    const urlParams = new URLSearchParams(window.location.search);
    let ticketId = urlParams.get('id') || "CAMP001";

    function generateQRCode(text) {
      const qrcodeContainer = document.getElementById("qrcode");
      qrcodeContainer.innerHTML = ""; // 清空舊的
      new QRCode(qrcodeContainer, {
        text: text,
        width: 180,
        height: 180,
        colorDark: "#1E1B4B",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    async function fetchTicketData() {
      document.getElementById('display-ticket-id').innerText = `TICKET ID: ${ticketId}`;
      generateQRCode(ticketId);

      try {
        const res = await fetch(`${GAS_API_URL}?action=getTicket&ticket_id=${ticketId}`);
        const data = await res.json();

        if (data.success) {
          document.getElementById('student-name').innerText = data.name;
          document.getElementById('student-team').innerText = data.team;
          
          const badge = document.getElementById('status-badge');
          const timeText = document.getElementById('checkin-time');

          if (data.is_checked_in) {
            badge.className = "mb-4 px-4 py-1.5 rounded-full text-xs font-bold bg-green-100 text-green-800";
            badge.innerText = "✓ 已完成報到";
            timeText.innerText = data.checked_in_at;
          } else {
            badge.className = "mb-4 px-4 py-1.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800 animate-pulse";
            badge.innerText = "● 尚未報到";
            timeText.innerText = "尚未報到";
          }
        } else {
          document.getElementById('student-name').innerText = "查無學員資料";
        }
      } catch (err) {
        console.error("載入失敗", err);
      }
    }

    window.onload = fetchTicketData;
  </script>
</body>
</html>
